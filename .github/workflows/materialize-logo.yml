name: Materialize QISWAH PNG asset
on:
  push:
    branches: [main]
    paths-ignore:
      - public/assets/qiswah-logo-source.png
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write logo PNG
        env:
          LOGO_B64: 
      - run: echo "$LOGO_B64" | base64 --decode > public/assets/qiswah-logo-source.png
      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/qiswah-logo-source.png
          git diff --cached --quiet || git commit -m "chore: add supplied QISWAH PNG logo asset"
          git push
